<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Check Your Email | BK Projects Map</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #193e35;
            background: linear-gradient(135deg, #edf4ef, #dbe8e2);
        }
        .card {
            width: 100%;
            max-width: 440px;
            padding: 36px;
            background: white;
            border: 1px solid #e2ebe6;
            border-radius: 24px;
            box-shadow: 0 20px 70px #173d3514;
            text-align: center;
        }
        .brand {
            width: 64px;
            height: 64px;
            display: grid;
            place-items: center;
            margin: 0 auto 18px;
            border-radius: 18px;
            background: #174e43;
            color: white;
            font-size: 27px;
            font-weight: bold;
        }
        h1 { font-size: 25px; }
        p { color: #6c7d76; line-height: 1.7; }
        .button {
            display: block;
            margin-top: 24px;
            padding: 14px;
            border-radius: 10px;
            background: #174e43;
            color: white;
            font-weight: bold;
            text-decoration: none;
        }
        .button:hover { background: #103b32; }
        a:focus-visible {
            outline: 2px solid #39836f;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand" aria-hidden="true">BK</div>
        <h1>Check Your Email</h1>
        <p>
            If an eligible account matches the email address you entered,
            you'll receive a password reset link shortly.
        </p>
        <p>
            Check your inbox and spam folder.
            The link expires in one hour.
        </p>
        <a class="button" href="{% url 'accounts:login' %}">
            Back to Sign In
        </a>
    </main>
</body>
</html>
