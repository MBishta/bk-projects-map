<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password | BK Projects Map</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #193e35;
            background: linear-gradient(135deg, #edf4ef, #dbe8e2);
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 36px;
            background: white;
            border: 1px solid #e2ebe6;
            border-radius: 24px;
            box-shadow: 0 20px 70px #173d3514;
        }

        .brand {
            width: 64px;
            height: 64px;
            display: grid;
            place-items: center;
            margin: 0 auto 18px;
            border-radius: 18px;
            background: #174e43;
            color: white;
            font-size: 27px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin: 0 0 10px;
        }

        .intro {
            text-align: center;
            color: #6c7d76;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            min-height: 48px;
            padding: 12px;
            border: 1px solid #cad8d1;
            border-radius: 10px;
            font: inherit;
        }

        input:focus-visible,
        button:focus-visible,
        a:focus-visible {
            outline: 2px solid #39836f;
            outline-offset: 3px;
        }

        .submit {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #174e43;
            color: white;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .submit:hover { background: #103b32; }

        .error {
            padding: 12px;
            border: 1px solid #efcac4;
            border-radius: 10px;
            background: #fff0ee;
            color: #94392c;
            line-height: 1.7;
        }

        .back {
            display: block;
            margin-top: 24px;
            text-align: center;
            color: #174e43;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .card { padding: 28px 22px; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand" aria-hidden="true">BK</div>

        <h1>Forgot Password?</h1>
        <p class="intro">
            Enter the email address registered to your account.
            We'll send you a link to reset your password.
        </p>

        {% if form.errors %}
            <p class="error" role="alert">
                Please enter a valid email address.
            </p>
        {% endif %}

        <form method="post" action="{% url 'accounts:password_reset' %}">
            {% csrf_token %}

            <label for="email">Email Address</label>
            <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                autocapitalize="none"
                spellcheck="false"
                maxlength="254"
                value="{{ form.email.value|default_if_none:'' }}"
                required
                autofocus
            >

            <button class="submit" type="submit">
                Send Reset Link
            </button>
        </form>

        <a class="back" href="{% url 'accounts:login' %}">
            Back to Sign In
        </a>
    </main>
</body>
</html>
