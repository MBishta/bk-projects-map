<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BK Projects Map</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #18342f;
        }
        button { font: inherit; cursor: pointer; }
        #map { height: 100vh; height: 100dvh; }

        .filters {
            position: fixed;
            top: 16px;
            right: 12px;
            left: 60px;
            z-index: 1000;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .filters button {
            border: 1px solid #dce5e2;
            background: white;
            padding: 11px 16px;
            border-radius: 24px;
            box-shadow: 0 3px 12px #0002;
        }
        .filters button[aria-pressed="true"] {
            background: #174e43;
            color: white;
            border-color: #174e43;
        }
        .project-marker {
            border: none;
            background: transparent;
        }
        .marker-label {
            display: block;
            min-width: 46px;
            padding: 8px 5px;
            border: 3px solid white;
            border-radius: 20px;
            background: #174e43;
            color: white;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 3px 10px #0005;
        }
        .marker-label.finishing { background: #b76b18; }
        .marker-label.both { background: #6551a4; }

        .sheet {
            position: fixed;
            bottom: 24px;
            left: 12px;
            right: 12px;
            max-width: 540px;
            margin: auto;
            z-index: 1000;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 35px #0003;
            overflow: hidden;
        }
        #toggle-list {
            width: 100%;
            padding: 18px;
            background: white;
            border: none;
            color: #174e43;
            font-weight: bold;
        }
        #project-list {
            max-height: 38vh;
            overflow-y: auto;
            padding: 0 12px 12px;
        }
        .project-row {
            display: block;
            width: 100%;
            text-align: right;
            background: #f3f7f5;
            border: 1px solid #e0e9e5;
            border-radius: 12px;
            padding: 14px;
            margin-top: 8px;
        }
        .project-row small {
            display: block;
            color: #61726d;
            margin-top: 6px;
        }
        #status {
            padding: 0 16px 12px;
            margin: 0;
            text-align: center;
            font-size: 14px;
        }
        .popup { direction: rtl; text-align: right; }
        .popup a {
            display: inline-block;
            margin-top: 8px;
            color: #174e43;
            font-weight: bold;
        }
        .leaflet-control-attribution { font-size: 10px; }
    </style>
</head>
<body>
    <nav class="filters" aria-label="نوع الأعمال">
        <button data-type="all" aria-pressed="true">الكل</button>
        <button data-type="structure" aria-pressed="false">عظم</button>
        <button data-type="finishing" aria-pressed="false">تشطيب</button>
        <button data-type="both" aria-pressed="false">عظم وتشطيب</button>
    </nav>

    <div id="map" aria-label="خريطة المشاريع"></div>

    <section class="sheet" aria-label="قائمة المشاريع">
        <button id="toggle-list"
                aria-expanded="false"
                aria-controls="project-list">
            ▲ المشاريع
        </button>
        <p id="status" role="status">جاري تحميل المشاريع…</p>
        <div id="project-list" hidden></div>
    </section>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const status = document.getElementById("status");
        const list = document.getElementById("project-list");
        const toggle = document.getElementById("toggle-list");
        const filters = document.querySelectorAll("[data-type]");

        let projects = [];
        let selectedType = "all";
        let visibleCount = 0;

        function updateListButton() {
            const open = !list.hidden;
            toggle.setAttribute("aria-expanded", String(open));
            toggle.textContent =
                `${open ? "▼" : "▲"} المشاريع (${visibleCount})`;
        }

        toggle.addEventListener("click", () => {
            list.hidden = !list.hidden;
            updateListButton();
        });

        async function startMap() {
            if (!window.L) {
                status.textContent =
                    "تعذر تحميل مكتبة الخريطة. تحقق من الإنترنت وحدّث الصفحة.";
                return;
            }

            const map = L.map("map").setView([25.2854, 51.5310], 11);

            L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19,
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);

            const markers = L.featureGroup().addTo(map);

            function popupFor(project, lat, lng) {
                const box = document.createElement("div");
                box.className = "popup";

                const title = document.createElement("strong");
                title.textContent =
                    `${project.reference} — ${project.public_name}`;

                const details = document.createElement("p");
                details.textContent =
                    `${project.work_type_label} • ${project.area}`;

                const description = document.createElement("p");
                description.textContent = project.description || "";

                const link = document.createElement("a");
                link.textContent = "افتح الموقع في Google Maps";
                link.href =
                    `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
                link.target = "_blank";
                link.rel = "noopener noreferrer";

                box.append(title, details, description, link);
                return box;
            }

            function renderProjects() {
                markers.clearLayers();
                list.replaceChildren();

                const visible = projects.filter(project =>
                    selectedType === "all" ||
                    project.work_type === selectedType
                );

                visibleCount = visible.length;
                updateListButton();

                status.hidden = visibleCount > 0;
                status.textContent = "لا توجد مشاريع في هذا التصنيف.";

                visible.forEach(project => {
                    const lat = Number(project.latitude);
                    const lng = Number(project.longitude);

                    const label = document.createElement("span");
                    label.className = "marker-label";
                    if (["finishing", "both"].includes(project.work_type)) {
                        label.classList.add(project.work_type);
                    }
                    label.textContent = project.reference;

                    const marker = L.marker([lat, lng], {
                        title: project.public_name,
                        icon: L.divIcon({
                            className: "project-marker",
                            html: label,
                            iconSize: [54, 40],
                            iconAnchor: [27, 20]
                        })
                    });

                    marker.bindPopup(popupFor(project, lat, lng));
                    markers.addLayer(marker);

                    const row = document.createElement("button");
                    row.className = "project-row";
                    row.textContent =
                        `${project.reference} — ${project.public_name}`;

                    const detail = document.createElement("small");
                    detail.textContent =
                        `${project.work_type_label} • ${project.area}`;
                    row.append(detail);

                    row.addEventListener("click", () => {
                        list.hidden = true;
                        updateListButton();
                        map.setView([lat, lng], 16);
                        marker.openPopup();
                    });

                    list.append(row);
                });

                if (visibleCount > 0) {
                    map.fitBounds(markers.getBounds(), {
                        paddingTopLeft: [60, 100],
                        paddingBottomRight: [30, 150],
                        maxZoom: 14
                    });
                }
            }

            filters.forEach(button => {
                button.addEventListener("click", () => {
                    selectedType = button.dataset.type;
                    filters.forEach(item => {
                        item.setAttribute(
                            "aria-pressed",
                            String(item === button)
                        );
                    });
                    renderProjects();
                });
            });

            try {
                const response = await fetch(
                    "{% url 'public-project-list' %}",
                    {headers: {"Accept": "application/json"}}
                );
                if (!response.ok) throw new Error("API request failed");

                const data = await response.json();
                if (!Array.isArray(data)) throw new Error("Invalid response");

                projects = data;
                renderProjects();
            } catch (error) {
                status.hidden = false;
                status.textContent =
                    "تعذر تحميل المشاريع. حدّث الصفحة للمحاولة مرة أخرى.";
            }
        }

        startMap();
    </script>
</body>
</html>
