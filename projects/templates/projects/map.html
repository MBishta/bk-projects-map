{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>badriakafood projects</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #18342f;
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        #map {
            height: 100vh;
            height: 100dvh;
        }

        .corner-logo {
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            right: 12px;
            width: 64px;
            height: 64px;
            object-fit: contain;
            z-index: 1100;
        }

        .map-header {
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            right: 84px;
            left: 84px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: none;
        }

        .map-title {
            max-width: 100%;
            margin: 0;
            padding: 10px 18px;
            border: 1px solid #dce5e2;
            border-radius: 12px;
            background: white;
            color: #174e43;
            box-shadow: 0 3px 12px #0002;
            font-size: 20px;
            line-height: 1.4;
            text-align: center;
            overflow-wrap: anywhere;
            pointer-events: auto;
        }

        .filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            pointer-events: auto;
        }

        .filters button {
            border: 1px solid #dce5e2;
            background: white;
            color: #18342f;
            padding: 11px 16px;
            border-radius: 24px;
            box-shadow: 0 3px 12px #0002;
        }

        .filters button[aria-pressed="true"] {
            background: #174e43;
            color: white;
            border-color: #174e43;
        }

        .project-marker {
            border: none;
            background: transparent;
        }

        .marker-label {
            display: block;
            min-width: 46px;
            padding: 8px 5px;
            border: 3px solid white;
            border-radius: 20px;
            background: #174e43;
            color: white;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 3px 10px #0005;
        }

        .marker-label.finishing { background: #b76b18; }
        .marker-label.both { background: #6551a4; }

        .sheet {
            position: fixed;
            bottom: 24px;
            left: 12px;
            right: 12px;
            max-width: 540px;
            margin: auto;
            z-index: 1000;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 35px #0003;
            overflow: hidden;
        }

        #toggle-list {
            width: 100%;
            padding: 18px;
            background: white;
            border: none;
            color: #174e43;
            font-weight: bold;
        }

        #project-list {
            max-height: 38vh;
            overflow-y: auto;
            padding: 0 12px 12px;
        }

        .project-row {
            display: block;
            width: 100%;
            text-align: right;
            background: #f3f7f5;
            color: #18342f;
            border: 1px solid #e0e9e5;
            border-radius: 12px;
            padding: 14px;
            margin-top: 8px;
        }

        .project-row small {
            display: block;
            color: #61726d;
            margin-top: 6px;
        }

        #status {
            padding: 0 16px 12px;
            margin: 0;
            text-align: center;
            font-size: 14px;
        }

        .popup {
            direction: rtl;
            text-align: right;
        }

        .popup a {
            display: inline-block;
            margin-top: 8px;
            color: #174e43;
            font-weight: bold;
        }

        .map-back {
            position: fixed;
            bottom: 24px;
            left: 16px;
            z-index: 1100;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 48px;
            padding: 12px 18px;
            border: 1px solid #ffffff55;
            border-radius: 14px;
            background: #174e43;
            color: white;
            box-shadow: 0 4px 16px #0003;
            text-decoration: none;
            direction: ltr;
        }

        .map-back:hover { background: #103b32; }

        button:focus-visible,
        a:focus-visible {
            outline: 3px solid #48becb;
            outline-offset: 3px;
        }

        .leaflet-control-attribution { font-size: 10px; }

        @media (max-width: 900px) {
            body.internal-map .sheet { bottom: 88px; }
        }

        @media (max-width: 480px) {
            .corner-logo {
                width: 48px;
                height: 48px;
                right: 8px;
            }

            .map-header {
                right: 58px;
                left: 58px;
                gap: 10px;
            }

            .map-title {
                padding: 9px 12px;
                font-size: 15px;
            }

            .filters { gap: 6px; }

            .filters button {
                padding: 9px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body class="{% if internal_map %}internal-map{% endif %}">
    <img
        class="corner-logo"
        src="{% static 'projects/images/company-logo.jpeg' %}"
        alt="Badria Kafood Architecture"
        width="64"
        height="64"
    >

    <header class="map-header">
        <h1 class="map-title" lang="en" dir="ltr">
            Badriakafood Projects
        </h1>

        <nav class="filters" aria-label="نوع الأعمال">
            <button type="button" data-type="all" aria-pressed="true">
                الكل
            </button>
            <button type="button" data-type="structure" aria-pressed="false">
                عظم
            </button>
            <button type="button" data-type="finishing" aria-pressed="false">
                تشطيب
            </button>
            <button type="button" data-type="both" aria-pressed="false">
                عظم وتشطيب
            </button>
        </nav>
    </header>

    <div id="map" aria-label="خريطة المشاريع"></div>

    <section class="sheet" aria-label="قائمة المشاريع">
        <button id="toggle-list"
                type="button"
                aria-expanded="false"
                aria-controls="project-list">
            ▲ المشاريع
        </button>
        <p id="status" role="status">جاري تحميل المشاريع…</p>
        <div id="project-list" hidden></div>
    </section>

    {% if internal_map %}
        <a class="map-back"
           href="{% url 'project-list' %}"
           aria-label="Back to projects list">
            <svg width="20" height="20" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
                <path d="M19 12H5M12 19l-7-7 7-7"></path>
            </svg>
            <span>Back</span>
        </a>

        {{ map_projects|json_script:"internal-projects-data" }}
    {% endif %}

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const statusElement = document.getElementById("status");
        const list = document.getElementById("project-list");
        const toggle = document.getElementById("toggle-list");
        const filters = document.querySelectorAll("[data-type]");
        const header = document.querySelector(".map-header");
        const sheet = document.querySelector(".sheet");

        let projects = [];
        let selectedType = "all";
        let visibleCount = 0;

                function updateFilterCounts() {
            const labels = {
                all: "الكل",
                structure: "عظم",
                finishing: "تشطيب",
                both: "عظم وتشطيب"
            };

            const counts = {
                all: projects.length,
                structure: 0,
                finishing: 0,
                both: 0
            };

            projects.forEach(project => {
                if (
                    ["structure", "finishing", "both"].includes(
                        project.work_type
                    )
                ) {
                    counts[project.work_type] += 1;
                }
            });

            filters.forEach(button => {
                const type = button.dataset.type;
                button.textContent = `${labels[type]} (${counts[type]})`;
            });
        }

        function updateListButton() {
            const open = !list.hidden;
            toggle.setAttribute("aria-expanded", String(open));
            toggle.textContent =
                `${open ? "▼" : "▲"} المشاريع (${visibleCount})`;
        }

        toggle.addEventListener("click", () => {
            list.hidden = !list.hidden;
            updateListButton();
        });

        async function startMap() {
            if (!window.L) {
                statusElement.textContent =
                    "تعذر تحميل مكتبة الخريطة. تحقق من الإنترنت وحدّث الصفحة.";
                return;
            }

            const map = L.map("map").setView([25.2854, 51.5310], 11);

            L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19,
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);

            const markers = L.featureGroup().addTo(map);

            function popupFor(project, lat, lng) {
                const box = document.createElement("div");
                box.className = "popup";

                const title = document.createElement("strong");
                title.textContent =
                    `${project.reference} — ${project.public_name}`;

                const details = document.createElement("p");
                details.textContent =
                    `${project.work_type_label} • ${project.area}`;

                const description = document.createElement("p");
                description.textContent = project.description || "";

                const link = document.createElement("a");
                link.textContent = "افتح الموقع في Google Maps";
                link.href =
                    `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
                link.target = "_blank";
                link.rel = "noopener noreferrer";

                box.append(title, details, description, link);
                return box;
            }

            function renderProjects() {
                markers.clearLayers();
                list.replaceChildren();

                const visible = projects.filter(project =>
                    selectedType === "all" ||
                    project.work_type === selectedType
                );

                visibleCount = visible.length;
                updateListButton();

                statusElement.hidden = visibleCount > 0;
                statusElement.textContent =
                    "لا توجد مشاريع في هذا التصنيف.";

                visible.forEach(project => {
                    const lat = Number(project.latitude);
                    const lng = Number(project.longitude);

                    const label = document.createElement("span");
                    label.className = "marker-label";

                    if (["finishing", "both"].includes(project.work_type)) {
                        label.classList.add(project.work_type);
                    }

                    label.textContent = project.reference;

                    const marker = L.marker([lat, lng], {
                        title: project.public_name,
                        icon: L.divIcon({
                            className: "project-marker",
                            html: label,
                            iconSize: [54, 40],
                            iconAnchor: [27, 20]
                        })
                    });

                    marker.bindPopup(popupFor(project, lat, lng));
                    markers.addLayer(marker);

                    const row = document.createElement("button");
                    row.type = "button";
                    row.className = "project-row";
                    row.textContent =
                        `${project.reference} — ${project.public_name}`;

                    const detail = document.createElement("small");
                    detail.textContent =
                        `${project.work_type_label} • ${project.area}`;
                    row.append(detail);

                    row.addEventListener("click", () => {
                        list.hidden = true;
                        updateListButton();
                        map.setView([lat, lng], 16);
                        marker.openPopup();
                    });

                    list.append(row);
                });

                if (visibleCount > 0) {
                    const mapHeight = map.getSize().y;

                    const topPadding = Math.min(
                        header.getBoundingClientRect().bottom + 20,
                        mapHeight * 0.35
                    );

                    const bottomPadding = Math.min(
                        window.innerHeight -
                            sheet.getBoundingClientRect().top + 20,
                        mapHeight * 0.35
                    );

                    map.fitBounds(markers.getBounds(), {
                        paddingTopLeft: [60, topPadding],
                        paddingBottomRight: [30, bottomPadding],
                        maxZoom: 14
                    });
                }
            }

            filters.forEach(button => {
                button.addEventListener("click", () => {
                    selectedType = button.dataset.type;

                    filters.forEach(item => {
                        item.setAttribute(
                            "aria-pressed",
                            String(item === button)
                        );
                    });

                    renderProjects();
                });
            });

            try {
                const internalData = document.getElementById(
                    "internal-projects-data"
                );

                let data;

                if (internalData) {
                    data = JSON.parse(internalData.textContent);
                } else {
                    const response = await fetch(
                        "{% url 'public-project-list' %}",
                        {headers: {"Accept": "application/json"}}
                    );

                    if (!response.ok) {
                        throw new Error("API request failed");
                    }

                    data = await response.json();
                }

                if (!Array.isArray(data)) {
                    throw new Error("Invalid response");
                }

                projects = data;
                updateFilterCounts();
                renderProjects();
            } catch (error) {
                statusElement.hidden = false;
                statusElement.textContent =
                    "تعذر تحميل المشاريع. حدّث الصفحة للمحاولة مرة أخرى.";
            }
        }

        startMap();
    </script>
</body>
</html>
